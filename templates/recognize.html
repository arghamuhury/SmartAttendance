{% extends 'base.html' %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold text-success">Live Attendance</h2>
    <p class="text-muted">Students will be automatically recognized and marked present.</p>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card bg-dark border-0">
            <div class="card-body p-0 text-center">
                <div class="video-container m-3">
                    <img src="{{ url_for('face.recognize_feed') }}" class="video-feed w-100" style="max-width: 800px;" alt="Live Recognition Feed">
                </div>
            </div>
            <div class="card-footer bg-dark border-0 text-center pb-4">
                <button id="markAttendanceBtn" class="btn btn-success btn-lg px-5 rounded-pill shadow">
                    <i class="fas fa-check-circle me-2"></i> Mark Attendance
                </button>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header bg-white">
                <h5 class="mb-0 fw-bold">Live Status</h5>
            </div>
            <div class="card-body bg-light" id="statusLog" style="max-height: 500px; overflow-y: auto;">
                <div class="text-center text-muted mt-5" id="emptyLog">
                    <i class="fas fa-clock fa-3x mb-3 opacity-25"></i>
                    <p>Waiting for faces...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const markAttendanceBtn = document.getElementById('markAttendanceBtn');
    const statusLog = document.getElementById('statusLog');
    const emptyLog = document.getElementById('emptyLog');
    
    // Function to add log entry
    function addLog(message, type) {
        if(emptyLog) emptyLog.style.display = 'none';
        
        const div = document.createElement('div');
        div.className = `alert alert-${type} py-2 mb-2 shadow-sm`;
        div.innerHTML = `<small><strong>${new Date().toLocaleTimeString()}</strong><br>${message}</small>`;
        
        statusLog.prepend(div);
    }

    markAttendanceBtn.addEventListener('click', function() {
        markAttendanceBtn.disabled = true;
        markAttendanceBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Processing...';
        
        fetch('{{ url_for("face.mark_attendance") }}', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                addLog(data.message, 'success');
            } else {
                addLog(data.message, 'info');
            }
        })
        .catch(err => {
            console.error(err);
            addLog('Error processing request.', 'danger');
        })
        .finally(() => {
            markAttendanceBtn.disabled = false;
            markAttendanceBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i> Mark Attendance';
        });
    });
    
    // Optional: We can auto-trigger the check every few seconds
    // setInterval(() => markAttendanceBtn.click(), 5000);
</script>
{% endblock %}
