{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="title" style="margin-bottom: 20px;">Add Subject</div>
    <form method="POST" action="{{ url_for('admin.add_subject') }}">
        <input type="text" name="name" placeholder="Subject Name (e.g., Data Science)" required>
        <input type="text" name="code" placeholder="Subject Code (e.g., DS101)" required>
        <button type="submit" class="btn">Add Subject</button>
    </form>
</div>

<h3 style="margin: 20px 0 10px 5px;">Existing Subjects</h3>
{% for subject in subjects %}
<div class="card flex-between" style="padding: 15px;">
    <div>
        <div style="font-weight: 500;">{{ subject.name }}</div>
        <div class="subtitle">{{ subject.code }}</div>
    </div>
</div>
{% else %}
<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">No subjects found.</p>
{% endfor %}
{% endblock %}
